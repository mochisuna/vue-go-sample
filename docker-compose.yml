services:
  vue-app:
    stdin_open: true
    tty: true
    build:
      context: ./app
      target: build-vue
    command: sh -c "corepack enable && yarn install && NODE_OPTIONS=--openssl-legacy-provider yarn run serve"
    environment:
      - NODE_OPTIONS=--openssl-legacy-provider
    volumes:
      - ./app:/app
    ports:
      - 39000:8080
    depends_on:
      - go-app

  go-app:
    build:
      context: ./server
      target: build-go
    command: make dev
    volumes:
      - ./server:/go/server
    ports:
      - 38080:8080

